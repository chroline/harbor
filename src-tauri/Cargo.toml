[package]
name = "harbor"
version = "0.1.0"
edition = "2021"

[features]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "harbor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
portable-pty = "0.9"
ts-rs = { version = "11", features = ["serde-json-impl"] }
sha2 = "0.10"
base64 = "0.22"
tar = "0.4"
flate2 = "1"
walkdir = "2"
libc = "0.2"

tempfile = "3"
tauri-plugin-opener = "2.7.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSView", "NSButton", "NSControl", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSNotification", "NSObject", "NSGeometry", "NSOperation", "NSString", "block2"] }
