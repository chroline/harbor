      <stop offset=".28" stop-color="#679ac0"/>
      <stop offset=".63" stop-color="#3d6786"/>
      <stop offset="1" stop-color="#233c50"/>
    </linearGradient>
    <linearGradient id="waveRim" x1="624" y1="790" x2="841" y2="859" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a6d9f2"/>
      <stop offset=".43" stop-color="#d7f0fa"/>
      <stop offset="1" stop-color="#7196ad" stop-opacity="0"/>
    </linearGradient>
    <filter id="tileShadow" x="-30%" y="-20%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#131d29" flood-opacity=".15"/>
