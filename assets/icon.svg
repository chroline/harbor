    <filter id="markShadow" x="-30%" y="-20%" width="170%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <path id="tileShape" d="M420 177H834C917 177 968 190 1012 234C1059 281 1077 327 1077 413V831C1077 917 1062 965 1015 1012C969 1058 919 1067 834 1067H422C337 1067 287 1058 241 1012C194 965 178 917 178 831V413C178 327 195 281 242 234C286 190 337 177 420 177Z"/>
    <path id="sailShape" d="M475 369C475 354 484 349 497 361L814 678C825 690 820 701 803 701H679C650 701 635 705 615 725L488 858C480 867 475 863 475 852V369Z"/>
    <clipPath id="sailClip"><use href="#sailShape"/></clipPath>
