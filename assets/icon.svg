<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1254 1254" fill="none">
  <title>Harbor — silver sail and blue wave</title>
  <defs>
    <linearGradient id="tile" x1="280" y1="185" x2="945" y2="1040" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34383b"/>
      <stop offset=".38" stop-color="#1c1f21"/>
      <stop offset="1" stop-color="#0b0d0f"/>
    </linearGradient>
    <radialGradient id="tileLight" cx="0" cy="0" r="1" gradientTransform="translate(345 174) rotate(63) scale(620 850)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#72787c" stop-opacity=".32"/>
      <stop offset=".55" stop-color="#44494d" stop-opacity=".05"/>
      <stop offset="1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="330" y1="177" x2="760" y2="1050" gradientUnits="userSpaceOnUse">
      <stop stop-color="#777c80"/>
      <stop offset=".2" stop-color="#33373a"/>
      <stop offset=".7" stop-color="#111315"/>
      <stop offset="1" stop-color="#25282a"/>
    </linearGradient>
    <linearGradient id="sail" x1="509" y1="392" x2="652" y2="849" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fafaf9"/>
      <stop offset=".33" stop-color="#e7e8e9"/>
      <stop offset=".65" stop-color="#b5bbc2"/>
      <stop offset="1" stop-color="#536171"/>
    </linearGradient>
    <linearGradient id="fold" x1="639" y1="621" x2="691" y2="769" gradientUnits="userSpaceOnUse">
      <stop stop-color="#bfc2c5"/>
      <stop offset="1" stop-color="#66717d"/>
    </linearGradient>
    <linearGradient id="sailEdge" x1="477" y1="366" x2="811" y2="695" gradientUnits="userSpaceOnUse">
