    <use href="#sailShape" stroke="url(#sailEdge)" stroke-opacity=".45" stroke-width="1.5"/>
    <path d="M539 867C578 824 636 766 705 765C770 761 835 793 872 826C889 841 889 855 874 865C859 875 840 866 817 858C771 841 733 839 698 846C645 855 591 882 552 884C533 886 529 879 539 867Z" fill="url(#wave)" stroke="#729db9" stroke-opacity=".25" stroke-width="1.5"/>
    <path d="M545 865C595 818 644 775 709 773C770 768 827 795 870 829C830 789 770 761 705 765C637 767 578 822 545 865Z" fill="url(#waveRim)"/>
  </g>
