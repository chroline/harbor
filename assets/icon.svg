  <g filter="url(#tileShadow)">
    <use href="#tileShape" fill="url(#tile)"/>
    <use href="#tileShape" fill="url(#tileLight)"/>
    <use href="#tileShape" stroke="url(#rim)" stroke-width="2"/>
  </g>
  <g filter="url(#markShadow)">
    <use href="#sailShape" fill="url(#sail)"/>
    <g clip-path="url(#sailClip)">
