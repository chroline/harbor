      <path d="M482 355L817 682C777 650 748 622 708 613C696 610 686 611 676 616L492 392Z" fill="url(#sailEdge)" opacity=".83"/>
      <path d="M478 370V851" stroke="white" stroke-opacity=".36" stroke-width="4"/>
