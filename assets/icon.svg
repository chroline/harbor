      <stop offset=".62" stop-color="#f9f9f9"/>
      <stop offset="1" stop-color="#c9cdd2"/>
    </linearGradient>
    <linearGradient id="wave" x1="630" y1="775" x2="765" y2="915" gradientUnits="userSpaceOnUse">
