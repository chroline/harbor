<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Woven light fidelity comparison</title>
    <style>
      body {
        margin: 0;
        background: #202020;
        color: #eee;
        font: 14px system-ui;
      }
      nav {
        height: 40px;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 12px;
      }
      main {
        position: relative;
        width: 1016px;
        height: 668px;
        overflow: hidden;
        margin: auto;
        background: #202020;
      }
      main img,
      main canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      main img {
        object-fit: cover;
        object-position: center;
        filter: blur(12px);
        opacity: 0.2;
      }
      #old {
        visibility: hidden;
      }
      pre {
        white-space: pre-wrap;
        padding: 12px;
      }
    </style>
  </head>
  <body>
    <nav>
      <button id="before">Before</button><button id="after">Optimized</button
      ><label
        >Time
        <select id="time">
          <option>0</option>
          <option>6</option>
          <option>30</option>
        </select></label
      ><label
        >Scene
        <select id="scene">
          <option>night</option>
          <option>day</option>
        </select></label
      ><strong id="view">Optimized</strong>
    </nav>
    <main>
      <img alt="" /><canvas id="old"></canvas><canvas id="new"></canvas>
    </main>
    <pre id="result"></pre>
    <script type="module" src="/tests/skyline-comparison.ts"></script>
  </body>
</html>
